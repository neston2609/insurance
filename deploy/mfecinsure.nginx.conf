server {
    listen 80;
    server_name mfecinsure.demohub24.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name mfecinsure.demohub24.com;
    ssl_certificate /etc/letsencrypt/live/mfecinsure.demohub24.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mfecinsure.demohub24.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 3600s;

    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location = /manage { proxy_pass http://127.0.0.1:3101; }
    location ^~ /manage/ { proxy_pass http://127.0.0.1:3101; }
    location = /api/admin { proxy_pass http://127.0.0.1:3101; }
    location ^~ /api/admin/ { proxy_pass http://127.0.0.1:3101; }
    location ~ ^/api/public/(policies|agent-callbacks|call-back-results)(/|$) {
        proxy_pass http://127.0.0.1:3101;
    }
    location / { proxy_pass http://127.0.0.1:3100; }
}
